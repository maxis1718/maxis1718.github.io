<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1c1e">

<meta name="format-detection" content="telephone=no">
<title>SKG Home Walkthrough</title>
<meta name="description" content="Interactive 3D walkthrough of the Sengkang Grand unit — walk room by room on phone or desktop.">
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --glass: rgba(26, 26, 28, 0.38); --glass-hi: rgba(255, 255, 255, 0.14); --line: rgba(255, 255, 255, 0.16);
    --text: #f7f4ee; --muted: rgba(247, 244, 238, 0.68); --accent: #e9c48f;
    --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1c1e; color: var(--text); font-family: var(--font);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none; position: fixed; inset: 0; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; outline: none; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  #vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 120% 95% at 50% 46%, rgba(0,0,0,0) 52%, rgba(20,14,8,0.14) 78%, rgba(12,8,4,0.38) 100%); }
  body.mode-overview #vignette { opacity: 0.6; }
  #touch { position: fixed; inset: 0; z-index: 2; touch-action: none; }
  #touch.off { pointer-events: none; }
  #touch.off .joy { opacity: 0 !important; }
  #hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  #hud .card { pointer-events: auto; background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 8px 28px rgba(0,0,0,0.18), inset 0 1px 0 var(--glass-hi); border-radius: 16px; }

  /* room card */
  .room-card { position: absolute; left: calc(12px + var(--sal)); top: calc(12px + var(--sat)); padding: 10px 14px 9px; min-width: 120px; max-width: 46vw; pointer-events: none !important; }
  .room-card .zh { font-size: 19px; font-weight: 600; letter-spacing: 0.06em; line-height: 1.2; }
  .room-card .en { font-size: 11.5px; color: var(--muted); margin-top: 3px; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-card .dims { color: var(--accent); }

  /* toolbar */
  .toolbar { position: absolute; left: calc(12px + var(--sal)); top: calc(78px + var(--sat)); display: flex; gap: 2px; padding: 4px; border-radius: 14px !important; }
  .tb { appearance: none; border: 0; background: transparent; color: var(--text); font: 500 11px/1 var(--font); letter-spacing: 0.08em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 50px; height: 50px; border-radius: 11px; cursor: pointer; touch-action: manipulation; }
  .tb svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tb:active { background: rgba(255,255,255,0.12); }
  .tb.on { background: rgba(233,196,143,0.22); color: var(--accent); }
  .tb.dim { opacity: 0.55; }
  @media (hover: hover) { .tb:hover { background: rgba(255,255,255,0.1); } }

  /* minimap */
  .minimap { position: absolute; right: calc(12px + var(--sar)); top: calc(12px + var(--sat)); padding: 6px; border-radius: 14px !important; cursor: pointer; }
  .minimap canvas { display: block; border-radius: 9px; }

  /* room menu */
  .menu { position: absolute; left: calc(12px + var(--sal)); top: calc(136px + var(--sat)); width: min(300px, calc(100vw - 24px - var(--sal) - var(--sar)));
    max-height: calc(100% - 160px - var(--sat) - var(--sab)); overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .menu[hidden] { display: none; }
  .menu-list { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .menu-h { padding: 6px 10px 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: var(--muted); }
  .menu-h small { font-weight: 400; margin-left: 6px; }
  .menu-item { display: grid; grid-template-columns: 1fr; row-gap: 1px; width: 100%; text-align: left; padding: 9px 10px; border: 0;
    background: transparent; color: var(--text); border-radius: 10px; font-family: var(--font); cursor: pointer; touch-action: manipulation; }
  .menu-item:active, .menu-item:hover { background: rgba(255,255,255,0.1); }
  .menu-item .mz { font-size: 15px; font-weight: 600; letter-spacing: 0.05em; }
  .menu-item .me { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-item .md { font-size: 10.5px; color: var(--accent); }

  /* joysticks */
  .joy { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; transition: opacity .25s; opacity: 0.55; }
  .joy:not(.active) { transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s; }
  .joy.active { opacity: 1; }
  .joy-ring { position: absolute; left: -58px; top: -58px; width: 116px; height: 116px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.12) 70%, rgba(255,255,255,0.03) 100%);
    border: 1.5px solid rgba(255,255,255,0.38); box-shadow: 0 6px 24px rgba(0,0,0,0.15); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .joy-knob { position: absolute; left: -25px; top: -25px; width: 50px; height: 50px; border-radius: 50%; margin: 0;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95), rgba(235,232,226,0.82)); box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
  .joy-knob { transform-origin: center; }
  .joy:not(.active) .joy-knob { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .joy-label { position: absolute; left: -40px; top: 66px; width: 80px; text-align: center; font-size: 11px; color: rgba(255,255,255,0.86); text-shadow: 0 1px 4px rgba(0,0,0,.5); line-height: 1.25; }
  .joy-label b { display: block; font-weight: 600; letter-spacing: 0.12em; }
  .joy-label span { font-size: 9.5px; letter-spacing: 0.14em; opacity: 0.75; }
  .joy.active .joy-label { opacity: 0; }
  @media (hover: hover) and (pointer: fine) { .joy { display: none; } }

  /* overview labels */
  .room-label { text-align: center; color: #fff; background: rgba(20,20,22,0.55); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px 5px; border-radius: 9px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-family: var(--font); line-height: 1.2; white-space: nowrap; }
  .room-label b { display: block; font-size: 13px; letter-spacing: 0.06em; }
  .room-label span { display: block; font-size: 9.5px; opacity: 0.75; }
  .room-label em { display: block; font-style: normal; font-size: 10px; color: var(--accent); }
  .room-label.small { transform: scale(0.82); }
  .room-label.small span { display: none; }
  .room-label.compact { padding: 3px 6px 4px; border-radius: 7px; }
  .room-label.compact b { font-size: 11.5px; }
  .room-label.compact span { display: none; }
  .room-label.compact em { font-size: 9px; }
  .room-label.compact.small em { display: none; }

  /* hint + loading + fader */
  .hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none; padding: 18px 20px 14px; border-radius: 20px;
    background: rgba(22,22,24,0.55); border: 1px solid var(--line); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); min-width: 250px; transition: opacity .4s; }
  .hint.bye { opacity: 0; }
  .hint-row { display: flex; align-items: center; gap: 14px; margin: 6px 0 12px; }
  .hint-row b { display: block; font-size: 15px; letter-spacing: 0.04em; }
  .hint-row span { font-size: 11.5px; color: var(--muted); }
  .hint-stick { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.5); position: relative; flex: none; }
  .hint-stick i { position: absolute; left: 11px; top: 11px; width: 18px; height: 18px; border-radius: 50%; background: #fff; animation: nudge 1.6s ease-in-out infinite; }
  .hint-stick.r i { animation-name: nudge2; }
  @keyframes nudge { 0%,100% { transform: translate(0,0); } 30% { transform: translate(9px,0); } 65% { transform: translate(-9px,0); } }
  @keyframes nudge2 { 0%,100% { transform: translate(0,0); } 40% { transform: translate(0,-9px); } }
  .kbd { font: 600 11px/1 var(--font); padding: 8px 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.35); min-width: 62px; text-align: center; flex: none; }
  .hint-foot { text-align: center; font-size: 11.5px; color: var(--accent); letter-spacing: 0.08em; margin-top: 4px; }
  #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at 50% 40%, #2d2c2a, #161617 70%); transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .t1 { font-size: 22px; font-weight: 600; letter-spacing: 0.24em; }
  #loading .t2 { font-size: 11px; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; }
  #loading .bar { width: 140px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  #loading .bar i { display: block; width: 40%; height: 100%; background: var(--accent); animation: load 1.2s ease-in-out infinite; }
  #loadingText { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
  @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  #fader { position: fixed; inset: 0; z-index: 5; background: #111; opacity: 0; pointer-events: none; transition: opacity .18s; }
  #fader.on { opacity: 1; }
  #err { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 20; padding: 10px 12px; border-radius: 10px; background: rgba(120,30,30,0.85); font-size: 12px; display: none; }
  @media (max-width: 420px) { .tb { width: 46px; height: 48px; } .room-card .zh { font-size: 17px; } }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
  <div id="stage"></div>
  <div id="vignette"></div>
  <div id="touch"></div>
  <div id="hud"></div>
  <div id="fader"></div>
  <div id="loading"><div class="t1">盛港 · 家</div><div class="t2">Sengkang Grand · 3D</div><div class="bar"><i></i></div><div id="loadingText">載入中 Loading…</div></div>
  <div id="err"></div>
  <script>
    // block page zoom / scroll gestures (iOS Safari ignores user-scalable=no)
    for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
    document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove', (e) => { if (!e.target.closest || !e.target.closest('.menu')) e.preventDefault(); }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTouchEnd < 320 && !(e.target.closest && e.target.closest('button'))) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('error', (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = 'Error: ' + (e.message || e); });
    window.addEventListener('unhandledrejection', (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); });
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
